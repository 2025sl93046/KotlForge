name: Android Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'diagnostics/**'
      - 'build-engine/**'
      - 'deploy/**'
      - 'watch/**'
      - 'cli/**'
      - 'samples/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build sample APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make KotlForge Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Make sample Gradle wrapper executable
        run: chmod +x samples/android-app/gradlew

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Build KotlForge
        run: ./gradlew build -x test

      - name: Install KotlForge CLI
        run: ./gradlew :cli:installDist

      - name: Run KotlForge doctor
        run: ./cli/build/install/cli/bin/cli doctor --project samples/android-app

      - name: Build sample APK with KotlForge (debug)
        run: ./cli/build/install/cli/bin/cli build --project samples/android-app --variant debug

      - name: Verify APK exists and is non-empty
        run: |
          APK=$(find samples/android-app -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -eq 0 ]; then
            echo "ERROR: APK is empty: $APK"
            exit 1
          fi
          echo "APK verified: $APK ($SIZE bytes)"

      - name: Verify kotlforge-build.log not written on success
        run: |
          if [ -f samples/android-app/kotlforge-build.log ]; then
            echo "ERROR: kotlforge-build.log should not be written on successful build"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-app-debug-apk
          path: samples/android-app/app/build/outputs/apk/debug/*.apk

      - name: Upload KotlForge report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlforge-report
          path: samples/android-app/kotlforge-report.json

      - name: Upload KotlForge build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlforge-build-log
          path: samples/android-app/kotlforge-build.log
