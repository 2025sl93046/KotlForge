name: KotlForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run checks
        run: ./gradlew clean check

      # TODO: Add detekt static analysis step (./gradlew detekt) and publish report as artifact
      # TODO: Add code coverage reporting (Kover) and enforce minimum threshold (e.g. 80%)
      # TODO: Split into parallel jobs: unit-tests, detekt, build — to reduce wall-clock time
      # TODO: Add caching for ~/.gradle/caches and ~/.gradle/wrapper to speed up builds
      # TODO: Fail fast on KotlinCompilerWarning — add -Werror to Kotlin compile options
      # TODO: Add check that CONTRIBUTING.md / docs are updated when new modules are added
